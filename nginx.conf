server {
  listen 80;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # 'unsafe-eval' is required: the bchrpc bindings in vendor/bchrpc-pb run
  # Function('return this')() when loaded. connect-src allows any https host
  # because users can pick any bchd node.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # text/html is always compressed.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_vary on;

  # expires sets Cache-Control without add_header, which would drop the
  # headers above for that location.
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    # index.html names the current assets, so browsers revalidate it.
    expires -1;
  }

  # Built assets have content hashes in their names, so they never change.
  location /assets/ {
    root   /usr/share/nginx/html;
    expires 1y;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
