name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Install scripts are skipped: the only one the build or tests could
      # use compiles deasync, which the tests never load and which has no
      # prebuilt binary for Node 24.
      - run: npm ci --ignore-scripts
      # npm run lint fixes problems instead of failing on them.
      - run: npx vue-cli-service lint --no-fix
      - run: npm test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
